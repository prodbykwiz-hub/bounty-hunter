name: Bounty Hunter

on:
  schedule:
    # GitHub может задерживать cron на несколько минут при высокой нагрузке.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Запуски не должны пересекаться, иначе оба отправят одни и те же задачи.
concurrency:
  group: bounty-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Бесплатный сервис Render засыпает без входящих запросов: будим агента.
      # Адрес — переменная AGENT_URL (Settings → Secrets and variables → Variables).
      - name: Wake agent
        if: vars.AGENT_URL != ''
        continue-on-error: true
        run: curl -fsS -m 60 --retry 2 "${{ vars.AGENT_URL }}/health" || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bounty hunter
        env:
          # Секреты с префиксом GITHUB_ создать нельзя: по умолчанию используется
          # встроенный токен, свой PAT можно положить в секрет GH_PAT.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Необязательные настройки (Settings → Secrets and variables → Variables).
          LANGUAGES: ${{ vars.LANGUAGES }}
          MIN_STARS: ${{ vars.MIN_STARS }}
          MIN_FORKS: ${{ vars.MIN_FORKS }}
          MIN_REWARD: ${{ vars.MIN_REWARD }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
          COMPETITION_THRESHOLD: ${{ vars.COMPETITION_THRESHOLD }}
          SKIP_HIGH_COMPETITION: ${{ vars.SKIP_HIGH_COMPETITION }}
          MAX_MESSAGES_PER_RUN: ${{ vars.MAX_MESSAGES_PER_RUN }}
          PLATFORMS: ${{ vars.PLATFORMS }}
          GIGS: ${{ vars.GIGS }}
          AUTO_MODE: ${{ vars.AUTO_MODE }}
          GIG_MIN_USD: ${{ vars.GIG_MIN_USD }}
          GIG_MAX_COMPETITORS: ${{ vars.GIG_MAX_COMPETITORS }}
          GIG_MAX_AGE_HOURS: ${{ vars.GIG_MAX_AGE_HOURS }}
          GIG_MAX_PER_RUN: ${{ vars.GIG_MAX_PER_RUN }}
          SUPERTEAM_CATEGORY: ${{ vars.SUPERTEAM_CATEGORY }}
          FREELANCER_JOBS: ${{ vars.FREELANCER_JOBS }}
        run: python main.py

      # Состояние сохраняем даже при ошибке бота: уже отправленные задачи
      # должны попасть в seen_issues.json, иначе в следующий раз придут дубли.
      - name: Commit seen_issues.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_issues.json
          if git diff --cached --quiet; then
            echo "seen_issues.json не изменился"
            exit 0
          fi
          cp seen_issues.json "$RUNNER_TEMP/ours.json"
          git commit -m "chore: update seen issues [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then
              exit 0
            fi
            # Файл успел поменять другой запуск: объединяем записи обоих, наши новее.
            echo "Конфликт или отказ push (попытка $attempt), объединяю seen_issues.json"
            git rebase --abort 2>/dev/null || true
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --hard "origin/${GITHUB_REF_NAME}"
            python - "$RUNNER_TEMP/ours.json" <<'PY'
          import json, sys
          ours = json.load(open(sys.argv[1], encoding="utf-8"))
          theirs = json.load(open("seen_issues.json", encoding="utf-8"))
          issues = dict(theirs.get("issues") or {})
          issues.update(ours.get("issues") or {})
          ours["issues"] = dict(sorted(issues.items()))
          with open("seen_issues.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(ours, ensure_ascii=False, indent=2) + chr(10))
          PY
            git add seen_issues.json
            git diff --cached --quiet || git commit --quiet -m "chore: update seen issues [skip ci]"
            sleep 3
          done
          exit 1
